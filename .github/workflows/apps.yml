# Baut die installierbaren Apps und stellt sie als Release bereit:
#   Windows (.exe-Installer) und Android (.apk)
name: Apps bauen

on:
  push:
    branches: ['claude/quartett-arrangement-engine-v4qemm', 'main']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Versionsnummer
        run: node scripts/write-version.mjs
      # Mit Code-Signing-Zertifikat (Secrets WIN_CSC_LINK = .pfx als Base64 oder https-Link, WIN_CSC_KEY_PASSWORD)
      # wird der Installer signiert – nur so verschwindet die SmartScreen-Warnung „unbekannte App“ dauerhaft.
      # Ohne Secrets entsteht wie bisher ein unsignierter Installer.
      - name: Windows-Installer bauen
        run: npx electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK == '' && 'false' || 'true' }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor installieren
        run: npm install --no-save --no-audit --no-fund @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Web-App & Android-Projekt
        run: |
          node scripts/write-version.mjs
          node scripts/build-web.mjs www
          npx cap add android
          cp -r build/android/mipmap-* android/app/src/main/res/
          npx cap sync android
      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK umbenennen
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/NoteCode-${VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Update-Paket (In-App-Update ohne Neuinstallation)
        run: |
          node scripts/write-version.mjs
          node scripts/build-web.mjs www
          (cd www && zip -qr ../out/notecode-web.zip .)
          node -e "const v=require('./version.json'); require('fs').writeFileSync('out/web-version.json', JSON.stringify({...v, zip:'notecode-web.zip'}))"
          cat out/web-version.json
      - name: Release veröffentlichen
        id: rel
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: NoteCode 1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            ## Neu in 1.1

            - **Schnelle Läufe & Tonwiederholungen** aus Aufnahmen: Sechzehntel, Triolen und 32tel bleiben erhalten, einzelne Sechzehntel werden erkannt, Halbtempo-Fehler bei schnellen Liedern werden korrigiert.
            - **Spielbare Quartett-Stimmen**: höchstens Oktavsprünge, eigenständiger Rhythmus der Mittelstimmen, keine Stille mitten im Stück.
            - **Spurentrennung mit Demucs** (Desktop-App, optional): Gesang, Begleitung und Bass werden getrennt gehört, das Schlagzeug liefert keine Geisternoten. Einrichtung: `node scripts/setup-demucs.mjs`.
            - **Aufwand immer Ultra** (änderbar nur in den Einstellungen), **Stil immer automatisch**.
            - Gespeicherte Aufnahmen werden beim Öffnen einmalig mit der neuen Erkennung neu berechnet.
            - **Orchestrierung für 1–15 Stimmen** mit Ensemble-Vorlagen, Stimmen-Zeilen (Instrument, Rolle, Schlüssel, Transposition) und Notenausgabe als MusicXML 4.0.
            - **Führung & Stimmendynamik**: „Dynamisch & Polyphon“ (Einwürfe in Melodielücken, Gegenmelodien, Mini-Soli, synkopierte Begleitung) oder „Klassischer Solo-Lead“, dazu ein Regler für die Aktivität der Nebenstimmen (1–5).
            - **Werktreue bei „Automatisch“**: jeder erkannte Melodieton bleibt erhalten (kein Atem-Schnitt in der Lead-Stimme, keine zusammengefassten Wiederholungen); kurze Töne mit klarem Anschlag werden erkannt. „Neu analysieren“ wendet das auf gespeicherte Aufnahmen an.

            ## NoteCode installieren

            | Gerät | Datei |
            |---|---|
            | **Windows** | `NoteCode-Setup-….exe` herunterladen und starten (bei „Der Computer wurde durch Windows geschützt“: *Weitere Informationen → Trotzdem ausführen*) |
            | **Android** | `NoteCode-…-Android.apk` auf dem Handy herunterladen, öffnen und installieren (beim ersten Mal „Installation aus dieser Quelle erlauben“) |

            **Schon installiert?** Ab dieser Version aktualisiert sich NoteCode selbst: Einstellungen → *App & Updates* → *Nach Updates suchen* (wird auch beim Start geprüft). `notecode-web.zip` und `web-version.json` sind dieses Update-Paket. Die Windows-Warnung betrifft nur den Installer, nicht die Updates in der App.

            Stand: ${{ github.sha }}
      - name: Release veröffentlichen (zweiter Versuch)
        if: steps.rel.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: NoteCode 1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          body: |
            ## Neu in 1.1

            - **Schnelle Läufe & Tonwiederholungen** aus Aufnahmen: Sechzehntel, Triolen und 32tel bleiben erhalten, einzelne Sechzehntel werden erkannt, Halbtempo-Fehler bei schnellen Liedern werden korrigiert.
            - **Spielbare Quartett-Stimmen**: höchstens Oktavsprünge, eigenständiger Rhythmus der Mittelstimmen, keine Stille mitten im Stück.
            - **Spurentrennung mit Demucs** (Desktop-App, optional): Gesang, Begleitung und Bass werden getrennt gehört, das Schlagzeug liefert keine Geisternoten. Einrichtung: `node scripts/setup-demucs.mjs`.
            - **Aufwand immer Ultra** (änderbar nur in den Einstellungen), **Stil immer automatisch**.
            - Gespeicherte Aufnahmen werden beim Öffnen einmalig mit der neuen Erkennung neu berechnet.
            - **Orchestrierung für 1–15 Stimmen** mit Ensemble-Vorlagen, Stimmen-Zeilen (Instrument, Rolle, Schlüssel, Transposition) und Notenausgabe als MusicXML 4.0.
            - **Führung & Stimmendynamik**: „Dynamisch & Polyphon“ (Einwürfe in Melodielücken, Gegenmelodien, Mini-Soli, synkopierte Begleitung) oder „Klassischer Solo-Lead“, dazu ein Regler für die Aktivität der Nebenstimmen (1–5).
            - **Werktreue bei „Automatisch“**: jeder erkannte Melodieton bleibt erhalten (kein Atem-Schnitt in der Lead-Stimme, keine zusammengefassten Wiederholungen); kurze Töne mit klarem Anschlag werden erkannt. „Neu analysieren“ wendet das auf gespeicherte Aufnahmen an.

            ## NoteCode installieren

            | Gerät | Datei |
            |---|---|
            | **Windows** | `NoteCode-Setup-….exe` herunterladen und starten (bei „Der Computer wurde durch Windows geschützt“: *Weitere Informationen → Trotzdem ausführen*) |
            | **Android** | `NoteCode-…-Android.apk` auf dem Handy herunterladen, öffnen und installieren (beim ersten Mal „Installation aus dieser Quelle erlauben“) |

            **Schon installiert?** Ab dieser Version aktualisiert sich NoteCode selbst: Einstellungen → *App & Updates* → *Nach Updates suchen* (wird auch beim Start geprüft). `notecode-web.zip` und `web-version.json` sind dieses Update-Paket. Die Windows-Warnung betrifft nur den Installer, nicht die Updates in der App.

            Stand: ${{ github.sha }}
